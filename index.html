<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Notas</title>
<!-- Para instalarla en el iPhone (Compartir → Añadir a pantalla de inicio) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notas">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#222220" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/estilos.css">
<script>try { const t = localStorage.getItem('notas.tema'); if (t) document.documentElement.dataset.tema = t; } catch {}</script>
</head>
<body>
<div class="app">
  <nav class="sectores" aria-label="Secciones">
    <div class="marca">Notas</div>
    <button class="sector activo" data-sector="agenda"><span class="icono"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span><span>Agenda</span></button>
    <button class="sector" data-sector="finanzas" disabled><span class="icono"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M15 15h2.5"/></svg></span><span>Finanzas</span><small>pronto</small></button>
    <button class="tema" id="tema"><span class="icono"></span><span class="tema-texto"></span></button>
    <button class="salir" id="salir" hidden>Cerrar sesión</button>
  </nav>
  <main id="contenido"></main>
</div>
<dialog id="dialogo"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/datos.js"></script>
<script src="js/agenda.js"></script>
<script src="js/app.js"></script>
</body>
</html>
